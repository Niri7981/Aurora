[package]
name = "aurora"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
rmcp = { version = "2.2", default-features = false, features = ["elicitation", "macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1", features = ["io-std", "macros", "rt"] }
uuid = "1"
